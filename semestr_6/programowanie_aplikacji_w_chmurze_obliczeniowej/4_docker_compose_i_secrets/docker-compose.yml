name: lemp-stack

services:

  nginx:
    image: nginx:1.31.1
    container_name: nginx
    restart: unless-stopped
    ports:
      - "4001:80"
    volumes:
      - ./www:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - frontend
      - backend

  db:
    image: mysql:9.7.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    networks:
      - backend

  php:
    image: php:8.5.7-fpm
    container_name: php
    restart: unless-stopped
    expose:
      - "9000"
    volumes:
      - ./www:/var/www/html:ro
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "6001:80"
    depends_on:
      - db
    networks:
      - backend

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db_data:

networks:
  frontend:
  backend:
